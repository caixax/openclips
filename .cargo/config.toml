# Defaults for locating the GStreamer MSVC development files on Windows.
# Each entry only applies when the variable is not already set, so an
# installation in a different location just needs the variables exported.
[env]
PKG_CONFIG_PATH = { value = "C:/Program Files/gstreamer/1.0/msvc_x86_64/lib/pkgconfig", force = false }
PKG_CONFIG = { value = "C:/Program Files/gstreamer/1.0/msvc_x86_64/bin/pkg-config.exe", force = false }
