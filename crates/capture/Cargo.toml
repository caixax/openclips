[package]
name = "openclips-capture"
description = "Platform capture and encoding backends for OpenClips"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
openclips-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-pbutils.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast"] }
async-io = "2"
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
png.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
pkg-config = "0.3"

[lints]
workspace = true
