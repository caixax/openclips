[package]
name = "openclips-app"
description = "OpenClips desktop application: UI, tray, hotkeys and wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "openclips"
path = "src/main.rs"

[dependencies]
openclips-core.workspace = true
openclips-capture.workspace = true
slint.workspace = true
raw-window-handle.workspace = true
discord-rich-presence.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
global-hotkey.workspace = true
rfd.workspace = true
trash.workspace = true
ureq.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_System_Threading", "Wdk_Graphics_Direct3D"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
